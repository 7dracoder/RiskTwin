[project]
name = "risktwin"
version = "0.1.0"
description = "RiskTwin — local multimodal safety sentinel for construction lift clearance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.17",
    "pymongo>=4.13",
    "numpy>=2.0",
    # Pinned below 5.0: OpenCV 5 removed HOGDescriptor, CascadeClassifier and the
    # bundled Haar cascades that the local detection/redaction pipeline uses.
    "opencv-python-headless>=4.10,<5",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "agents*", "packages*"]
exclude = ["apps.dashboard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
